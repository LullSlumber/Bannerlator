name: CI Build (artifacts only)

# TEST builds — artifacts only, NO release. Delegates the whole build to the
# reusable _build.yml (matrix over the 3 flavors, all caching). release.yml uses
# the SAME reusable build, so the build logic lives in exactly one place.

on:
  # Every push to main builds too (log-only "[skip ci]" commits and docs don't), so main's caches
  # stay fresh: branches can only restore main's caches, and setup-gradle writes only on main.
  push:
    branches: [main]
    paths-ignore:
      - 'PROGRESS_LOG.md'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      release_number:
        description: 'Label for APK file names (e.g. 1.0-fixes)'
        required: true
        default: '1.0-test'
      flavors:
        description: 'Flavors to build (standard/ludashi/pubg/antutu, comma-separated). Empty = all.'
        required: false
        default: 'standard'

permissions:
  contents: read

concurrency:
  # A newer push to main replaces a main build still running; manual builds never cancel.
  group: ${{ github.event_name == 'push' && 'ci-main' || format('ci-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  # Convert the comma-separated flavor picker ('standard' / 'standard,antutu' / '') into
  # the JSON array of {id,task} objects the reusable matrix build expects.
  prep:
    runs-on: ubuntu-22.04
    outputs:
      flavors: ${{ steps.mk.outputs.json }}
    steps:
      - id: mk
        run: |
          IN="${{ inputs.flavors }}"
          if [ -z "$IN" ]; then IN="standard,ludashi,pubg,antutu"; fi
          JSON=""
          FIRST=1
          IFS=',' read -ra PARTS <<< "$IN"
          for F0 in "${PARTS[@]}"; do
            F=$(echo "$F0" | tr -d ' ')
            if [ -z "$F" ]; then continue; fi
            T="assemble${F^}Release"
            if [ "$FIRST" = "0" ]; then JSON+=","; fi
            JSON+="{\"id\":\"$F\",\"task\":\"$T\"}"
            FIRST=0
          done
          JSON="[$JSON]"
          echo "json=$JSON" >> "$GITHUB_OUTPUT"
          echo "matrix flavors: $JSON"

  build:
    needs: prep
    uses: ./.github/workflows/_build.yml
    with:
      release_number: ${{ inputs.release_number || 'main' }}
      flavors: ${{ needs.prep.outputs.flavors }}
    secrets:
      # Test builds bundle the Samsung Galaxy Performance SDK when the secret is present
      # (empty otherwise). release.yml deliberately does NOT pass this, so public release
      # APKs stay free of the proprietary jar until redistribution is explicitly decided.
      GALAXY_PERF_SDK_JAR_B64: ${{ secrets.GALAXY_PERF_SDK_JAR_B64 }}
